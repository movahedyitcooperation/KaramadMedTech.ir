[project]
name = "karamad-backend"
version = "0.1.0"
description = "Karamad MedTech — FastAPI backend"
readme = "README.md"
authors = [
    { name = "NoahProphet", email = "sinaap81@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "passlib>=1.7.4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false
